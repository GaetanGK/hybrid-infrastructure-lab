---
- name: Installer le script check_mem
  hosts: linux_servers
  become: yes

  tasks:
    - name: Télécharger le script check_mem
      get_url:
        url: https://raw.githubusercontent.com/justintime/nagios-plugins/master/check_mem/check_mem.pl
        dest: /usr/lib/nagios/plugins/check_mem
        mode: '0755'
